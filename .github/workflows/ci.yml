name: Vérifications

# À chaque envoi et chaque demande de fusion : lint, types, code mort et tests (avec couverture).
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  # Aucun secret ne doit entrer dans l'historique.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - run: uv run pytest -q --cov=app --cov-report=term-missing:skip-covered

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run
      - run: npx knip --no-progress

  # Parcours complets dans un vrai navigateur (Playwright), sur l'application lancée avec une IA factice.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Lancer l'application
        run: |
          mkdir -p "$RUNNER_TEMP/noteclaire"
          export DATABASE_URL="sqlite:///$RUNNER_TEMP/noteclaire/app.db" DATA_DIR="$RUNNER_TEMP/noteclaire" BACKUP_DIR="$RUNNER_TEMP/noteclaire/backups" AI_PROVIDER=fake
          (cd backend && uv run alembic upgrade head && nohup uv run uvicorn --factory app.main:create_app --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &)
          (cd frontend && nohup npm run dev -- --port 5173 > "$RUNNER_TEMP/frontend.log" 2>&1 &)
          for i in $(seq 1 60); do curl -fs http://localhost:5173/api/health && break; sleep 2; done
      - run: npx playwright test
        working-directory: frontend
        env:
          BASE_URL: http://localhost:5173
      # Les serveurs lancés en arrière-plan tiendraient le verrou du cache uv et bloqueraient la fin du job.
      - name: Arrêter l'application
        if: always()
        run: pkill -f uvicorn || true; pkill -f vite || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/test-results
            ${{ runner.temp }}/backend.log
