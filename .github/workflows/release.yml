name: Publier les images

# À chaque tag vX.Y.Z : construit et publie noteclaire-backend et noteclaire-frontend sur ghcr.io,
# puis crée la release GitHub. Les tests passent avant la publication.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # Les mêmes vérifications que la CI (lint, types, tests, parcours complets) avant toute publication.
  checks:
    uses: ./.github/workflows/ci.yml

  images:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nom du dépôt en minuscules
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/metadata-action@v5
        id: meta-backend
        with:
          images: ghcr.io/${{ env.OWNER }}/noteclaire-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: APP_VERSION=${{ steps.meta-backend.outputs.version }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ env.OWNER }}/noteclaire-backend:latest
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/metadata-action@v5
        id: meta-frontend
        with:
          images: ghcr.io/${{ env.OWNER }}/noteclaire-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ env.OWNER }}/noteclaire-frontend:latest
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
