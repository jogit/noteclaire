[project]
name = "noteclaire-backend"
version = "0.1.0"
description = "API de NoteClaire"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "openai>=1.60",
    "python-multipart>=0.0.32",
    "pypdf>=6.19.0",
    "pyjwt[crypto]>=2.15.1",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "vulture>=2.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 11

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 90
