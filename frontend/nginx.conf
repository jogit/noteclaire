# Derrière un reverse proxy HTTPS, garde le protocole d'origine : le cookie de session est
# alors marqué « Secure ».
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 60m;

    include /etc/nginx/snippets/security-headers.conf;

    # Restauration d'une sauvegarde envoyée depuis l'ordinateur : peut contenir des photos.
    location = /api/backups/restore {
        client_max_body_size 2g;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # La mise au propre peut prendre du temps (AI_TIMEOUT_SECONDS + nouvelle tentative).
        proxy_read_timeout 300s;
    }

    # Retour de « Sign in with ChatGPT » (<adresse du site>/auth/callback).
    location = /auth/callback {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Le service worker et le manifeste doivent toujours être relus.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
